<style>
:root {
  --bg:      #f8f9fa;
  --white:   #ffffff;
  --border:  #e0e0e0;
  --text:    #202124;
  --muted:   #5f6368;
  --link:    #1a0dab;
  --green:   #0d652d;
  --accent:  #d93025;
  --gold:    #f4b400;
  --blue:    #1558d6;
  --radius:  8px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

/* ─── Top Bar ─── */
.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.topbar-inner {
  max-width: 900px; margin: 0 auto;
  padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.logo {
  font-size: 17px; font-weight: 700;
  color: var(--text); text-decoration: none;
  white-space: nowrap; letter-spacing: -.3px;
}
.logo em { font-style:normal; color: var(--accent); }

.search-wrap {
  flex: 1; max-width: 400px;
  display: flex; align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 7px 14px; gap: 8px;
  font-size: 13px; color: var(--muted);
}
.search-wrap svg { flex-shrink:0; opacity:.5; }

.topbar-right {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
}
.verified-badge {
  font-size: 11px; color: var(--green);
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
}

/* ─── Nav ─── */
.nav-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-bar::-webkit-scrollbar { display: none; }
.nav-inner {
  max-width: 900px; margin: 0 auto;
  padding: 0 16px;
  display: flex; gap: 0;
  white-space: nowrap;
}
.nav-link {
  display: inline-block;
  padding: 11px 14px;
  font-size: 13px; font-weight: 500;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.nav-link:hover  { color: var(--text); }
.nav-link.active { color: var(--blue); border-bottom-color: var(--blue); }

/* ─── Page wrap ─── */
.page { max-width: 900px; margin: 0 auto; padding: 0 12px 60px; }

/* ─── Breadcrumb ─── */
.breadcrumb {
  display: flex; align-items: center; gap: 5px;
  flex-wrap: wrap;
  padding: 12px 4px 8px;
  font-size: 12px; color: var(--muted);
}
.breadcrumb a { color: var(--blue); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { color: var(--border); }

/* ─── Page header ─── */
.page-header {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 18px 16px;
  margin-bottom: 14px;
}
.page-header h1 {
  font-size: 20px; font-weight: 700;
  color: var(--text); line-height: 1.25;
  letter-spacing: -.3px; margin-bottom: 8px;
}
.page-intro {
  font-size: 13px; color: var(--muted);
  line-height: 1.6; margin-bottom: 12px;
}
.page-meta {
  display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted);
  padding-top: 10px;
  border-top: 1px solid var(--bg);
}
.meta-upd { color: var(--green); font-weight: 500; }
.meta-author { display: flex; align-items: center; gap: 4px; }

/* ─── Trust bar ─── */
.trust-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.trust-item {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px; color: var(--muted);
  display: flex; align-items: center; gap: 5px;
}
.trust-item .ti { color: var(--green); }

/* ─── Disclaimer ─── */
.disclaimer {
  display: flex; align-items: flex-start; gap: 8px;
  background: #fffde7;
  border: 1px solid #f9a825;
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px; color: #5f4700;
  margin-bottom: 14px;
  line-height: 1.5;
}

/* ─── Section title ─── */
.section-title {
  font-size: 11px; font-weight: 700;
  color: var(--muted); letter-spacing: .6px;
  text-transform: uppercase;
  padding: 4px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}

/* ─── Card ─── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow .18s, border-color .18s;
  animation: up .35s ease both;
}
.card:nth-child(1){animation-delay:.03s}
.card:nth-child(2){animation-delay:.08s}
.card:nth-child(3){animation-delay:.13s}
.card:nth-child(4){animation-delay:.18s}
.card:nth-child(5){animation-delay:.23s}
@keyframes up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.card:hover { box-shadow:0 2px 12px rgba(0,0,0,.1); border-color:#bbb; }

.card-stripe { height:3px; background:var(--c,var(--blue)); }

.card-body {
  padding: 14px 14px 10px;
  display: flex; align-items: flex-start; gap: 12px;
}

/* Rank */
.rank {
  font-size: 20px; font-weight: 700;
  min-width: 28px; text-align: center;
  line-height: 1; margin-top: 6px;
  flex-shrink: 0; color: #e0e0e0;
}
.rank.g { color: var(--gold); }
.rank.s { color: #9e9e9e; }
.rank.b { color: #a1887f; }

/* Logo */
.logo-box {
  width: 48px; height: 48px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}

/* Info */
.info { flex:1; min-width:0; }
.info-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px;
  margin-bottom: 2px;
}
.offer-name {
  font-size: 15px; font-weight: 600;
  color: var(--link); line-height: 1.2;
}
.offer-url {
  font-size: 12px; color: var(--green);
  margin-bottom: 4px;
}
.offer-desc {
  font-size: 13px; color: var(--muted);
  line-height: 1.5; margin-bottom: 8px;
}
.badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 3px;
  flex-shrink: 0; white-space: nowrap;
}
.bg { background:#fef3c7; color:#92400e; }
.br { background:#fee2e2; color:#991b1b; }
.bb { background:#dbeafe; color:#1e40af; }
.bn { background:#d1fae5; color:#065f46; }

.rating-row {
  display: flex; align-items: center;
  gap: 8px; flex-wrap: wrap;
}
.stars { color:var(--gold); font-size:12px; letter-spacing:1px; }
.score { font-size:12px; font-weight:700; color:var(--text); }
.cnt   { font-size:11px; color:#bbb; }
.editor-pick {
  font-size:10px; font-weight:600;
  background:#e8f5e9; color:var(--green);
  padding:2px 7px; border-radius:3px;
}

/* Card footer */
.card-foot {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 14px 12px;
  gap: 8px;
}
.foot-hint { font-size:11px; color:var(--muted); }
.cta-btn {
  background: var(--blue); color:#fff;
  border:none; border-radius:4px;
  padding: 8px 20px;
  font-size: 13px; font-weight: 600;
  font-family:'Inter',sans-serif;
  cursor: pointer; white-space:nowrap;
  transition: background .15s;
}
.cta-btn:hover { background: #1246b5; }

/* ─── How we rate ─── */
.how-section {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin: 24px 0 14px;
}
.how-title { font-size:14px; font-weight:700; margin-bottom:12px; }
.criteria-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
@media(max-width:480px){ .criteria-grid { grid-template-columns:1fr; } }
.criterion {
  display: flex; align-items: flex-start;
  gap: 8px; padding: 8px;
  background: var(--bg); border-radius:6px;
}
.cr-dot {
  width:8px; height:8px; border-radius:50%;
  background: var(--blue); flex-shrink:0; margin-top:4px;
}
.cr-name { font-size:12px; font-weight:600; margin-bottom:1px; }
.cr-desc { font-size:11px; color:var(--muted); }

/* ─── FAQ ─── */
.faq-section { margin: 24px 0; }
.faq-title { font-size:16px; font-weight:700; margin-bottom:12px; }
.faq-item {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 6px;
  overflow: hidden;
}
.faq-q {
  display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
  padding: 14px 16px;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.faq-q:hover { background: var(--bg); }
.faq-arrow {
  font-size:16px; color:var(--muted);
  flex-shrink:0; transition: transform .2s;
}
.faq-item.open .faq-arrow { transform: rotate(180deg); }
.faq-a {
  display: none;
  padding: 0 16px 14px;
  font-size: 13px; color:var(--muted);
  line-height: 1.6;
  border-top: 1px solid var(--bg);
}
.faq-item.open .faq-a { display: block; }

/* ─── Footer ─── */
.page-footer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
  line-height: 1.8; text-align: center;
}

/* ─── Loading ─── */
.loader {
  display:flex; align-items:center; gap:8px;
  padding:32px 0; color:var(--muted); font-size:13px;
}
.spin {
  width:16px; height:16px;
  border:2px solid var(--border);
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Bottom Sheet ─── */
.overlay {
  position:fixed;inset:0;
  background:rgba(32,33,36,.5);
  z-index:100; opacity:0; pointer-events:none;
  transition:opacity .22s;
  backdrop-filter:blur(2px);
}
.overlay.open { opacity:1; pointer-events:all; }

.sheet {
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);
  border-radius:14px 14px 0 0;
  border-top:1px solid var(--border);
  z-index:101;
  max-height:85vh; overflow-y:auto;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,0,.21,1);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.sheet.open { transform:translateY(0); }
.sh-handle { width:32px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0; }
.sh-body { padding:18px 20px 28px; }

.sh-top {
  display:flex;align-items:center;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--bg);margin-bottom:14px;
}
.sh-ico { width:50px;height:50px;border-radius:12px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0; }
.sh-name  { font-size:18px;font-weight:700;color:var(--link);margin-bottom:2px; }
.sh-url   { font-size:12px;color:var(--green); }

.sh-score-row {
  background:var(--bg);border-radius:8px;
  padding:10px 14px;display:flex;align-items:center;gap:14px;margin-bottom:14px;
}
.sh-big { font-size:30px;font-weight:700;color:var(--text); }
.sh-stars { color:var(--gold);font-size:16px;margin-bottom:2px; }
.sh-votes { font-size:11px;color:var(--muted); }

.perks-head { font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:10px; }
.perks { display:flex;flex-direction:column;gap:8px;margin-bottom:20px; }
.perk  { display:flex;align-items:center;gap:8px;font-size:13px; }
.perk-ok { color:var(--green);font-size:14px;flex-shrink:0;font-weight:700; }

.sh-cta {
  display:block;width:100%;background:var(--blue);color:#fff;
  border:none;border-radius:6px;padding:14px;
  font-size:15px;font-weight:600;font-family:'Inter',sans-serif;
  cursor:pointer;text-align:center;text-decoration:none;
  transition:background .15s;margin-bottom:8px;
}
.sh-cta:hover { background:#1246b5; }
.sh-back {
  display:block;width:100%;background:#fff;border:1px solid var(--border);
  border-radius:6px;padding:11px;font-size:13px;color:var(--muted);
  font-family:'Inter',sans-serif;cursor:pointer;
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════
// Всі налаштування — в config.json
// Тут змінювати нічого не потрібно
// ═══════════════════════════════════════════════

const DEF_PERKS = ['Безкоштовна реєстрація','Мільйони реальних анкет','Зручно на мобільному','Збіги за хвилини'];
const BADGE_MAP = {TOP:'bg',ТОП:'bg',ХІТ:'br',HOT:'br',NEW:'bn',НОВИНКА:'bn'};

let cfg = {};
let offers = {};

// ── Завантаження config.json ──
async function loadConfig() {
  const res = await fetch('config.json');
  return res.json();
}

// ── Завантаження Google Sheets ──
async function loadSheets(sheetId, sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const txt  = await (await fetch(url)).text();
  const json = JSON.parse(txt.replace(/^.*?({.*}).*?$/s,'$1'));
  const cols = json.table.cols.map(c=>c.label.toLowerCase().trim());
  const out  = {};
  json.table.rows.forEach(row=>{
    const r={};
    cols.forEach((c,i)=>{r[c]=row.c[i]?.v??'';});
    if(!r.geo||!r.url) return;
    const g=String(r.geo).toLowerCase().trim();
    if(!out[g]) out[g]=[];
    out[g].push({
      id:     r.id     ||`${g}_${out[g].length+1}`,
      name:   r.name   ||'Offer',
      domain: r.domain ||r.url.replace(/https?:\/\//,'').split('/')[0],
      tagline:r.tagline||'',
      logo:   r.logo   ||'💘',
      badge:  r.badge  ||'NEW',
      rating: r.rating ||'4.8',
      users:  r.users  ||'',
      url:    r.url,
      color:  r.color  ||'#1558d6',
      order:  Number(r.order)||99,
      pinned: String(r.pinned).toUpperCase()==='TRUE',
      perks:  r.perks?String(r.perks).split(',').map(p=>p.trim()).filter(Boolean):DEF_PERKS,
    });
  });
  Object.keys(out).forEach(g=>out[g].sort((a,b)=>a.order-b.order));
  return out;
}

// ── Render nav ──
function renderNav(nav) {
  document.getElementById('navInner').innerHTML = nav.map(item=>`
    <a href="${item.url}" class="nav-link ${item.active?'active':''}">${item.label}</a>
  `).join('');
}

// ── Render breadcrumbs ──
function renderBreadcrumbs(crumbs) {
  document.getElementById('breadcrumb').innerHTML = crumbs.map((c,i)=>{
    const isLast = i === crumbs.length - 1;
    return isLast
      ? `<span>${c.label}</span>`
      : `<a href="${c.url}">${c.label}</a><span class="sep">›</span>`;
  }).join('');
}

// ── Render trust bar ──
function renderTrustBar(items) {
  document.getElementById('trustBar').innerHTML = items.map(t=>`
    <div class="trust-item"><span class="ti">${t.icon}</span>${t.text}</div>
  `).join('');
}

// ── Render offers ──
function renderOffers(list) {
  const rc = i => i===0?'g':i===1?'s':i===2?'b':'';
  const bc = b => BADGE_MAP[b]||'bb';

  document.getElementById('offerCnt').textContent = `${list.length} сайтів перевірено`;

  document.getElementById('offersList').innerHTML = !list.length
    ? `<div class="loader"><span>Офери ще не додані</span></div>`
    : list.map((o,i)=>`
      <article class="card" onclick="openSheet(${i})">
        <div class="card-stripe" style="--c:${o.color}"></div>
        <div class="card-body">
          <div class="rank ${rc(i)}">${i+1}</div>
          <div class="logo-box">${o.logo}</div>
          <div class="info">
            <div class="info-top">
              <span class="offer-name">${o.name}</span>
              <span class="badge ${bc(o.badge)}">${o.badge}</span>
            </div>
            <div class="offer-url">${o.domain}</div>
            <div class="offer-desc">${o.tagline}</div>
            <div class="rating-row">
              <span class="stars">★★★★★</span>
              <span class="score">${o.rating}/5</span>
              ${o.users?`<span class="cnt">· ${o.users} користувачів</span>`:''}
              ${o.pinned?`<span class="editor-pick">✓ Вибір редакції</span>`:''}
            </div>
          </div>
        </div>
        <div class="card-foot">
          <span class="foot-hint">✓ Безкоштовна реєстрація</span>
          <button class="cta-btn">Перейти →</button>
        </div>
      </article>
    `).join('');
}

// ── Render How we rate ──
function renderHowWeRate(section) {
  document.getElementById('howTitle').textContent = section.title;
  document.getElementById('criteriaGrid').innerHTML = section.criteria.map(c=>`
    <div class="criterion">
      <div class="cr-dot"></div>
      <div><div class="cr-name">${c.name}</div><div class="cr-desc">${c.desc}</div></div>
    </div>
  `).join('');
  document.getElementById('howSection').style.display='block';
}

// ── Render FAQ ──
function renderFAQ(faq) {
  document.getElementById('faqList').innerHTML = faq.map((item,i)=>`
    <div class="faq-item" id="faq-${i}">
      <div class="faq-q" onclick="toggleFAQ(${i})">
        <span>${item.q}</span>
        <span class="faq-arrow">▾</span>
      </div>
      <div class="faq-a">${item.a}</div>
    </div>
  `).join('');
  document.getElementById('faqSection').style.display='block';
}

function toggleFAQ(i) {
  document.getElementById(`faq-${i}`).classList.toggle('open');
}

// ── Schema.org ──
function injectSchema(cfg, list) {
  const base = `https://${cfg.site.domain}`;

  // BreadcrumbList
  document.getElementById('schemaBreadcrumb').textContent = JSON.stringify({
    "@context":"https://schema.org",
    "@type":"BreadcrumbList",
    "itemListElement": cfg.breadcrumbs.map((c,i)=>({
      "@type":"ListItem",
      "position": i+1,
      "name": c.label,
      "item": c.url ? base+c.url : undefined
    }))
  });

  // ItemList
  document.getElementById('schemaMain').textContent = JSON.stringify({
    "@context":"https://schema.org",
    "@type":"ItemList",
    "name": cfg.page.h1,
    "description": cfg.page.meta_desc,
    "itemListElement": list.map((o,i)=>({
      "@type":"ListItem",
      "position": i+1,
      "name": o.name,
      "url": o.url
    }))
  });

  // FAQPage
  if (cfg.faq?.length) {
    document.getElementById('schemaFAQ').textContent = JSON.stringify({
      "@context":"https://schema.org",
      "@type":"FAQPage",
      "mainEntity": cfg.faq.map(f=>({
        "@type":"Question",
        "name": f.q,
        "acceptedAnswer":{"@type":"Answer","text":f.a}
      }))
    });
  }
}

// ── Bottom Sheet ──
function openSheet(i) {
  const geo   = cfg.site.geo;
  const list  = offers[geo] || offers['default'] || [];
  const o     = list[i];
  if(!o) return;
  document.getElementById('shIco').textContent   = o.logo;
  document.getElementById('shName').textContent  = o.name;
  document.getElementById('shUrl').textContent   = o.domain;
  document.getElementById('shScore').textContent = o.rating;
  document.getElementById('shVotes').textContent = o.users?`${o.users} користувачів`:'Перевірено';
  document.getElementById('shCta').href          = o.url;
  document.getElementById('shPerks').innerHTML   =
    o.perks.map(p=>`<div class="perk"><span class="perk-ok">✓</span>${p}</div>`).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow='';
}
let ty=0;
document.getElementById('sheet').addEventListener('touchstart',e=>{ty=e.touches[0].clientY;});
document.getElementById('sheet').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty>70)closeSheet();});

// ── Meta tags ──
function setMeta(cfg) {
  const base = `https://${cfg.site.domain}`;
  document.getElementById('metaTitle').textContent  = cfg.page.meta_title;
  document.getElementById('metaDesc').content       = cfg.page.meta_desc;
  document.getElementById('canonical').href         = `${base}/ua/`;
  document.getElementById('ogTitle').content        = cfg.page.meta_title;
  document.getElementById('ogDesc').content         = cfg.page.meta_desc;
  document.getElementById('ogUrl').content          = `${base}/ua/`;
  document.title = cfg.page.meta_title;
}

// ── Init ──
async function init() {
  try { cfg = await loadConfig(); }
  catch(e) { console.error('Config load failed',e); return; }

  // Meta
  setMeta(cfg);

  // Nav
  renderNav(cfg.nav);

  // Breadcrumbs
  renderBreadcrumbs(cfg.breadcrumbs);

  // Header
  document.getElementById('pageH1').textContent    = cfg.page.h1;
  document.getElementById('pageIntro').textContent = cfg.page.intro;
  document.getElementById('metaUpd').textContent   = `✓ Оновлено ${cfg.site.updated}`;
  document.getElementById('metaAuthor').querySelector('span').textContent = cfg.site.author;
  document.getElementById('disclaimerText').textContent = cfg.disclaimer;

  // Trust bar
  renderTrustBar(cfg.trust_bar);

  // Load offers
  try {
    offers = await loadSheets(cfg.sheets.id, cfg.sheets.sheet_name);
  } catch(e) {
    document.getElementById('offersList').innerHTML =
      `<div class="loader"><span>⚠️ Вкажіть SHEET_ID в config.json</span></div>`;
    return;
  }

  const geo  = cfg.site.geo;
  const list = offers[geo] || offers['default'] || [];
  renderOffers(list);

  // How we rate
  if (cfg.how_we_rate) renderHowWeRate(cfg.how_we_rate);

  // FAQ
  if (cfg.faq?.length) renderFAQ(cfg.faq);

  // Schema
  injectSchema(cfg, list);

  // Footer
  document.getElementById('pageFooter').innerHTML =
    `© 2025 ${cfg.site.name} · Незалежні огляди · Контент для осіб 18+`;
}

init();
</script>
</body>
</html>
